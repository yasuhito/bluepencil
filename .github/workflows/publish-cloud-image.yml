name: Publish cloud image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-cloud-image
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      IMAGE: ghcr.io/yasuhito/bluepencil
    steps:
      - uses: actions/checkout@v5
      - name: Build cloud image
        run: docker build --platform linux/amd64 --build-arg PLOW_REVISION="$GITHUB_SHA" -f cloud/Dockerfile -t bluepencil:ci .
      - name: Probe cloud image
        run: docker run --rm --network none --entrypoint /opt/bluepencil/probe bluepencil:ci
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push tested image
        shell: bash
        run: |
          set -euo pipefail
          docker tag bluepencil:ci "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:$GITHUB_SHA" | tee push.log
          digest="$(sed -n 's/.*digest: \(sha256:[0-9a-f]\{64\}\).*/\1/p' push.log | tail -1)"
          test -n "$digest"
          printf '%s@%s\n' "$IMAGE" "$digest" | tee -a "$GITHUB_STEP_SUMMARY"
